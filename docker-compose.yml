# TrustCheck Docker Compose
# For local development and testing

services:
  trustcheck:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trustcheck
    ports:
      - "8000:8000"
    volumes:
      # Persist SQLite database
      - trustcheck_data:/app/data
      # Mount source for development (optional)
      # - ./src:/app/src:ro
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=sqlite+aiosqlite:///data/trustcheck.db
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  trustcheck_data:
    driver: local
